[project]
name = "visceral-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "narowtow", email = "justinlikestoplaytrumpet@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "duckdb==1.5.6",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas==3.0.6",
    "pandera[pandas]==0.34.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
]

[project.scripts]
visceral-pipeline = "visceral_pipeline:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pytest==9.1.1",
    "ruff>=0.17.1",
]
